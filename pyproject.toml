[project]
name = "ai-doc-editor"
version = "0.1.0"
description = "Edit Word and PDF documents with an LLM without breaking their layout"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "gradio>=5.0",
    "python-docx>=1.1",
    "lxml>=5.0",
    "pymupdf>=1.25",
    "pdf2docx>=0.5.8",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
ai-doc-editor = "ai_doc_editor.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "poethepoet>=0.29",
    "pymupdf-fonts>=1.0.5",  # fixtures only (Noto in layout.pdf)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_doc_editor"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ai-factory-kit", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "gradio.Progress"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "soffice: needs LibreOffice (soffice) on PATH",
    "live: needs a running LLM backend",
]

[tool.poe.tasks]
lint = { shell = "ruff check . && ruff format --check ." }
format = { shell = "ruff check --fix . && ruff format ." }
test = "pytest -m \"not live and not soffice\""
test-all = "pytest -m \"not live\""
fixtures = "python evals/make_fixtures.py"
eval = "python evals/run_invariants.py"
eval-models = "python evals/run_models.py"
serve = "uvicorn ai_doc_editor.api:app --host 127.0.0.1 --port 8000"
